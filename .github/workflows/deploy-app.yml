name: Deploy Application and Container
on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "config/**"
      - "Dockerfile"
      - "requirements.txt"
      - "manage.py"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: australia-southeast1
  REPOSITORY: todo-backend-repo
  IMAGE_NAME: todo-backend

jobs:
  build-scan-deploy:
    name: Build, Scan & Deploy Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@main

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_SA_EMAIL }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker CLI for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          vuln-type: "library"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push Container to Artifact Registry
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Output Deployment Status
        run: |
          echo "✅ Container successfully built, scanned, and pushed!"
          echo "Target Registry URL: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Get GKE Cluster Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "todo-cluster"
          location: "${{ env.GAR_LOCATION }}"

      - name: Deploy to Kubernetes Cluster
        run: |
          # 1. Replace project-id-placeholder with secret
          sed -i 's|project-id-placeholder|${{ secrets.GCP_PROJECT_ID }}|g' k8s/deployment.yaml

          # 2. Replace latest tag with the exact Git commit SHA
          sed -i 's|todo-backend:latest|todo-backend:${{ github.sha }}|g' k8s/deployment.yaml

          # 3. Apply manifests to cluster
          kubectl apply -f k8s/

          # 4. Wait for zero-downtime rolling update to complete
          kubectl rollout status deployment/todo-backend-deployment --timeout=360s

      - name: Debug Deployment Failure
        if: failure()
        run: |
          echo "==================== POD STATUS ===================="
          kubectl get pods -o wide
          echo "==================== POD EVENTS ===================="
          kubectl describe pods
          echo "==================== CONTAINER LOGS ================"
          kubectl logs -l app=todo-backend --tail=50 --all-containers=true
