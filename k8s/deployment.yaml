apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-deployment
  labels:
    app: todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
      metadata:
        labels:
          app: todo-backend
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          fsGroup: 10001
        containers:
          - name: todo-backend
            image: australia-southeast1-docker.pkg.dev/project-id-placeholder/todo-backend-repo/todo-backend:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            ports:
              - containerPort: 8080
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "250m"
                memory: "256Mi"
            env:
              - name: PYTHONUNBUFFERED
                value: "1"
            volumeMounts:
              - mountPath: /tmp
                name: tmp-volume
        volumes:
          - name: tmp-volume
            emptyDir: {}
