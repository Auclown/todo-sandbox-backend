apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-deployment
  labels:
    app: todo-backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
      metadata:
        labels:
          app: todo-backend
      spec:
        containers:
          - name: todo-backend
            image: australia-southeast1-docker.pkg.dev/project-id-placeholder/todo-backend-repo/todo-backend:latest
            imagePullPolicy: Always
            ports:
              - containerPort: 8080
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "250m"
                memory: "256Mi"
            env:
              - name: PYTHONUNBUFFERED
                value: "1"
